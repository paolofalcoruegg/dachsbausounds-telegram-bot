name: Weekly schedule reminder

on:
  schedule:
    # 12:15 UTC every Saturday = 14:15 in Zurich during summer time (13:15 in winter).
    # GitHub's scheduler is best-effort and can fire 10+ minutes late.
    - cron: '15 12 * * 6'
  workflow_dispatch:  # adds a "Run workflow" button for manual testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
